<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>某音分享链接解析</title>
<style>
  :root {
    --bg: #f7f7f5;
    --card: #ffffff;
    --border: #e3e2de;
    --text: #2c2c2a;
    --muted: #6b6a66;
    --accent: #185fa5;
    --ok: #3b6d11;
    --err: #a32d2d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 32px 16px; background: var(--bg); color: var(--text);
    font: 14px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .wrap { max-width: 980px; margin: 0 auto; }
  h1 { font-size: 20px; font-weight: 500; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  .panel { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
  textarea {
    width: 100%; min-height: 88px; padding: 12px; border: 1px solid var(--border);
    border-radius: 8px; font: 13px/1.6 inherit; resize: vertical; outline: none;
  }
  textarea:focus { border-color: var(--accent); }
  .row { display: flex; gap: 10px; align-items: center; margin-top: 12px; flex-wrap: wrap; }
  input[type=text] {
    padding: 7px 10px; border: 1px solid var(--border); border-radius: 8px;
    font: 13px inherit; outline: none; min-width: 240px;
  }
  input[type=text]:focus { border-color: var(--accent); }
  .hint { color: var(--muted); font-size: 12px; margin-top: 8px; line-height: 1.7; }
  .nav { display: flex; gap: 8px; max-width: 980px; margin: 0 auto 14px; }
  .nav a {
    padding: 5px 14px; border: 1px solid var(--border); border-radius: 8px;
    background: #fff; text-decoration: none; font-size: 13px; color: var(--muted);
  }
  .nav a.on { border-color: var(--accent); color: var(--accent); }
  code { background: #f1efe8; padding: 1px 5px; border-radius: 4px; font-size: 12px; }
  button {
    padding: 8px 18px; border: 1px solid var(--accent); background: var(--accent);
    color: #fff; border-radius: 8px; font: inherit; cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button.ghost { background: #fff; color: var(--accent); }
  label { color: var(--muted); font-size: 13px; display: inline-flex; gap: 6px; align-items: center; }
  .status { font-size: 13px; min-height: 20px; margin-top: 10px; }
  .status.ok { color: var(--ok); }
  .status.err { color: var(--err); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; margin-top: 16px; }
  .field { border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; background: #fcfcfa; }
  .field .k { color: var(--muted); font-size: 12px; }
  .field .v { font-size: 13px; word-break: break-all; margin-top: 2px; }
  a { color: var(--accent); }
  pre {
    background: #fcfcfa; border: 1px solid var(--border); border-radius: 8px;
    padding: 12px; overflow: auto; max-height: 420px; font-size: 12px; margin-top: 16px;
  }
  .hidden { display: none; }
</style>
</head>
<body>
  <div class="nav">
    <a href="/" class="on">单条解析</a>
    <a href="/batch">批量转写</a>
  </div>

  <div class="wrap">
  <h1>某音分享链接解析</h1>
  <div class="sub">粘贴任意某音分享文案，返回该视频的全部可获取信息</div>

  <div class="panel">
    <textarea id="input" placeholder="粘贴某音分享文案，例如：&#10;2.05 复制打开某音，看看【xxx的作品】... https://v.douyin.com/xxxxx/ :0pm u@s.RX yGI:/ 12/06"></textarea>
    <div class="row">
      <button id="btn">解析</button>
      <label><input type="checkbox" id="raw"> 附带原始字段</label>
    </div>
    <div class="row">
      <input type="text" id="backend" placeholder="后端地址，留空表示同源（如 http://127.0.0.1:8848）">
      <button id="ping" class="ghost">测试连接</button>
    </div>
    <div class="hint">
      页面只是壳子，解析要靠 Node 后端（浏览器直连某音会被 CORS 拦）。在项目目录执行
      <code>node src/server.js</code> 后再用；若页面不是从后端打开的，在上面的输入框填后端地址。
    </div>
    <div class="status" id="status"></div>

    <div id="summary" class="hidden"></div>
    <pre id="json" class="hidden"></pre>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// 后端地址：可用输入框覆盖，并记住上次填的
const DEFAULT_BACKEND = location.protocol === 'file:' ? 'http://127.0.0.1:8848' : '';
$('backend').value = localStorage.getItem('dsr_backend') ?? DEFAULT_BACKEND;
$('backend').addEventListener('change', () => localStorage.setItem('dsr_backend', $('backend').value.trim()));

const apiUrl = () => ($('backend').value.trim().replace(/\/+$/, '') || '') + '/api/resolve';

$('btn').addEventListener('click', run);
$('ping').addEventListener('click', ping);
$('input').addEventListener('keydown', (e) => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) run(); });

async function ping() {
  setStatus('', '测试中…');
  try {
    const r = await fetch(apiUrl().replace('/api/resolve', '/health'));
    const d = await r.json();
    setStatus('ok', r.ok && d.status === 'ok' ? '后端已连上 ✔' : `后端响应异常：HTTP ${r.status}`);
  } catch (e) {
    setStatus('err', `连不上后端（${e.message}）。请先在项目目录执行 node src/server.js，并在上方填写 http://127.0.0.1:8848`);
  }
}

async function run() {
  const text = $('input').value.trim();
  const raw = $('raw').checked;
  if (!text) return setStatus('err', '请先粘贴分享文案');

  $('btn').disabled = true;
  setStatus('', '解析中…（要跟随跳转 + 请求接口，通常 2-5 秒）');
  $('summary').classList.add('hidden');
  $('json').classList.add('hidden');

  let res;
  try {
    res = await fetch(apiUrl(), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text, raw })
    });
  } catch (e) {
    $('btn').disabled = false;
    return setStatus('err', `连不上后端（${e.message}）。请先在项目目录执行 node src/server.js，并在上方填写 http://127.0.0.1:8848`);
  }

  // 先取文本再解析，避免后端不在时拿到空 body 报 "Unexpected end of JSON input"
  const bodyText = await res.text();
  let data;
  try {
    data = JSON.parse(bodyText);
  } catch {
    $('btn').disabled = false;
    return setStatus('err', `后端返回的不是 JSON（HTTP ${res.status}）：${bodyText.slice(0, 120) || '空响应'}。多半是 ${apiUrl()} 没有对应的后端，请先启动服务并填写地址。`);
  }
  $('btn').disabled = false;

  $('json').textContent = JSON.stringify(data, null, 2);
  $('json').classList.remove('hidden');

  if (!data.ok) {
    const tip = data.error === 'aweme_not_matched_in_feed'
      ? '（接口没返回这条视频，可能链接失效或视频已删除；它不会报错，只会返回推荐流）'
      : '';
    setStatus('err', `失败：${data.error} ${tip}`);
  } else {
    setStatus('ok', `成功，耗时 ${data.elapsedMs} ms`);
    render(data);
    $('summary').classList.remove('hidden');
  }
}

function setStatus(cls, msg) {
  const el = $('status');
  el.className = 'status ' + cls;
  el.textContent = msg;
}

function field(k, v, link) {
  if (v === '' || v === undefined || v === null || v === '-') return '';
  const val = link ? `<a href="${esc(v)}" target="_blank" rel="noopener">${esc(v.slice(0, 60))}${v.length > 60 ? '…' : ''}</a>` : esc(v);
  return `<div class="field"><div class="k">${k}</div><div class="v">${val}</div></div>`;
}

function render(d) {
  const v = d.video, m = d.music, a = d.author, s = d.stats;
  const qualities = v.qualities.length ? v.qualities.map(q => `${q.width}x${q.height}`).join(' / ') : '接口未返回';
  $('summary').innerHTML = `
    <div class="grid">
      ${field('标题', d.desc)}
      ${field('作者', `${a.nickname} (${a.uid})`)}
      ${field('发布时间', d.createTimeText)}
      ${field('时长', v.durationSec + ' 秒')}
      ${field('分辨率', `${v.width}x${v.height}  ${v.ratio}`)}
      ${field('播放/点赞/评论', `${s.playCount} / ${s.diggCount} / ${s.commentCount}`)}
      ${field('话题', d.tags.map(t => t.name).join(' ') || '-')}
      ${field('视频地址', v.playUrl, true)}
      ${field('清晰度档位', qualities)}
      ${field('封面', v.cover, true)}
      ${field('音频来源', m.isOriginalSound ? '作者创作的原声（人声）' : '背景音乐 BGM')}
      ${field('配乐', `${m.title} - ${m.author}`)}
      ${field('音乐地址', m.playUrl, true)}
      ${field('重定向跳数', String(d.input.redirectChain.length))}
      ${field('aweme_id', d.input.awemeId)}
    </div>`;
}
</script>
</body>
</html>
